<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>아이디어 발산 · 수렴 — 브레인라이팅 · SCAMPER · 하이라이팅</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
:root{--navy:#1b2a4a;--gold:#b98a3d;--bg:#f5f6f9;--card:#fff;--fg:#1d2433;--muted:#5d6679;--line:#dde1ea;--tint:#f6efe1;--ok:#2f7a55;--warn:#a3621b;--bad:#b2453b;--ex:#8a93a6;--soft:#eef1f6;
--f:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11161f;--card:#19202c;--fg:#e6e9f0;--muted:#9aa3b5;--line:#2b3444;--tint:#2a241a;--ok:#6cc394;--warn:#e0a659;--bad:#ec8a80;--ex:#7d869a;--soft:#1c2740;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f);font-size:16px;line-height:1.7;word-break:keep-all;overflow-wrap:anywhere}
.wrap{max-width:1000px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--navy);color:#fff;position:sticky;top:0;z-index:20;border-bottom:3px solid var(--gold)}
header.top .wrap{padding-block:10px;display:flex;flex-direction:column;gap:6px}
.trow{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px}
h1{font-size:1.06rem;font-weight:800;margin:0}
.sync{font-size:12px;margin-left:auto;opacity:.9}.sync.bad{color:#ffb3a8;opacity:1;font-weight:700}
.bar{height:8px;background:rgba(255,255,255,.2);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .3s}
.barlab{font-size:12px;opacity:.9}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.tabs button{flex:0 0 auto;border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;border-radius:999px;padding:4px 12px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected=true]{background:var(--gold);border-color:var(--gold);color:#1b2a4a}
.tabs button.done::after{content:" ✓"}
main.wrap{padding-block:18px 60px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;min-width:0}
h2{font-size:1.18rem;margin:0 0 6px;line-height:1.4;color:var(--navy)}
@media (prefers-color-scheme:dark){h2{color:#a9bde3}}
h3{font-size:1rem;margin:14px 0 6px}
p{margin:6px 0}
.mut{color:var(--muted);font-size:14px}
.now{font-weight:800;color:var(--warn);font-size:14px;margin:8px 0 4px}
.key{border:2px solid var(--gold);border-radius:10px;padding:10px 14px;margin:8px 0;font-size:15px;background:var(--tint)}
.key b.k{display:block;font-size:16px;margin-bottom:2px}
.why{font-size:13.5px;color:var(--muted);border-left:3px solid var(--gold);padding-left:10px;margin:6px 0}
.ex{background:var(--soft);border:1px dashed var(--line);border-radius:10px;padding:10px 12px;font-size:14px;color:var(--muted);margin:8px 0}
.ex b.l{color:var(--gold);font-size:12px;letter-spacing:.04em;display:block}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13.5px;margin-top:8px}
.flow span{border:1px solid var(--line);border-radius:8px;padding:3px 9px;background:var(--bg)}
.flow span.on{background:var(--gold);color:#1b2a4a;border-color:var(--gold);font-weight:800}
.tg{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.tcard{text-align:left;border:2px solid var(--line);background:var(--card);color:var(--fg);border-radius:12px;padding:10px 12px;cursor:pointer;font:inherit}
.tcard b{display:block;font-size:15px}.tcard small{color:var(--muted);font-size:12.5px;display:block;line-height:1.5}
.tcard.sel{border-color:var(--gold);background:var(--tint)}
label.f{display:block;font-weight:800;font-size:14px;margin:12px 0 4px}
label.f em{font-style:normal;font-weight:500;color:var(--muted);font-size:12.5px;margin-left:6px}
input[type=text],textarea,select{width:100%;font:inherit;font-size:15px;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
textarea{min-height:56px;resize:vertical}
input::placeholder,textarea::placeholder{color:var(--ex)}
.btn{font:inherit;font-size:14px;font-weight:700;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;padding:7px 12px;cursor:pointer}
.btn.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.gold{background:var(--gold);color:#1b2a4a;border-color:var(--gold)}
.btn.sm{font-size:12.5px;padding:3px 9px}
.btn.on{background:var(--gold);border-color:var(--gold);color:#1b2a4a}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.idea{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14.5px;background:var(--card)}
.idea .by{font-size:11.5px;color:var(--muted)}
.idea.b{border-left:4px solid var(--gold)}
.idea.s{border-left:4px solid var(--navy)}
.idea.top{border-color:var(--gold);background:var(--tint)}
.idea .st{float:right;font-weight:800;color:var(--gold)}
.okline{color:var(--ok);font-weight:700;font-size:14px}.warnline{color:var(--warn);font-weight:700;font-size:14px}.badline{color:var(--bad);font-weight:700;font-size:14px}
.note{font-size:13.5px;background:var(--tint);border-radius:8px;padding:8px 10px}
.check{padding-left:4px;list-style:none;margin:6px 0}.check li{margin:4px 0}
.tw{overflow-x:auto}
table.g{border-collapse:collapse;width:100%;font-size:14px}
table.g th,table.g td{border:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left}
table.g th{background:var(--bg);font-size:13px}
.cuts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.cut{border:2px solid var(--line);border-radius:10px;padding:8px}
.cut b{display:block;font-size:13px;color:var(--gold)}
@media (max-width:640px){.cuts{grid-template-columns:1fr}}
.prev{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);font-size:14px}
.prev b{color:var(--navy)}
.hide{display:none!important}
.board{overflow-x:auto;padding:4px 0 6px}.bd3{display:grid;grid-template-columns:repeat(3,minmax(180px,1fr));gap:8px}.bd4{display:grid;grid-template-columns:repeat(4,minmax(170px,1fr));gap:8px}
.bcol{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:6px;min-height:110px}.bcol.on{outline:3px solid var(--gold)}.bh{font-size:13px;line-height:1.35;padding:2px 2px 6px;border-bottom:1px dashed var(--line);margin-bottom:4px}.bh span{font-size:11.5px;color:var(--muted)}
.stk{border-radius:3px;padding:6px 8px;font-size:12.5px;line-height:1.45;margin:7px 2px;box-shadow:0 2px 5px rgba(0,0,0,.18);color:#1d2433;transform:rotate(-1deg);position:relative}.stk:nth-child(even){transform:rotate(1deg)}
.stk.y{background:#fff1a8}.stk.p{background:#ffd3de}.stk.b{background:#cfe6ff}.stk.g{background:#d3f4cc}.stk.o{background:#ffe0b8}.stk.v{background:#e6dcff}.stk.w{background:#fff;border:1.5px dashed #b98a3d}
.stk .by{display:block;font-size:11px;color:#5d6679;margin-top:2px}.stk .st{position:absolute;right:6px;top:4px;font-weight:800;color:#b98a3d}.stk.sub{margin-left:14px;font-size:12px}.stk.top{outline:3px solid #b98a3d}
.bempty{font-size:12px;color:var(--muted);text-align:center;padding:14px 0}
.draft{display:inline-block;background:var(--gold);color:#1b1306;font-size:11px;font-weight:800;padding:1px 8px;border-radius:6px}
</style></head><body>
